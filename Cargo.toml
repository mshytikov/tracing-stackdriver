[package]
name = "tracing-stackdriver"
version = "0.11.0"
authors = ["Alex Pearson <alex@alexpear.com>"]
edition = "2021"
license = "MIT"
readme = "README.md"
repository = "https://github.com/NAlexPear/tracing-stackdriver"
description = "Stackdriver-compatible tracing layer and event formatter"
keywords = ["tracing", "stackdriver", "logging", "google", "gcp"]

[badges.maintenance]
status = "actively-developed"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
doctest = false

[dependencies]
Inflector = "0.11.4"
serde_json = "1.0.145"
tracing-core = "0.1.35"
thiserror = "2.0.17"

[dependencies.http]
optional = true
version = "1.4.0"

[dependencies.serde]
features = ["derive"]
version = "1.0.228"

[dependencies.time]
default-features = false
features = ["formatting"]
version = "0.3.44"

[dependencies.tracing-opentelemetry]
version = "0.32.0"
optional = true

[dependencies.tracing-subscriber]
features = ["json", "valuable"]
version = "0.3.22"

[dependencies.url]
optional = true
version = "2.5.7"

[dependencies.valuable]
optional = true
features = ["derive"]
version = "0.1.1"

[dependencies.valuable-serde]
optional = true
version = "0.1.0"

[dev-dependencies]
lazy_static = "1.5.0"
tracing = "0.1.43"
rand = "0.9.2"
opentelemetry_sdk = "0.31.0"

[dev-dependencies.time]
features = ["serde", "serde-well-known", "formatting"]
version = "0.3.44"

[dev-dependencies.opentelemetry]
default-features = false
features = ["testing", "trace"]
version = "0.31.0"

[dev-dependencies.opentelemetry-stdout]
features = ["trace"]
version = "0.31.0"

[features]
valuable = ["dep:valuable", "valuable-serde", "http", "url"]
opentelemetry = ["tracing-opentelemetry"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tracing_unstable)'] }
